schema_version: 1
default_mode: assistive
timezone: Australia/Sydney

testing_windows:
  - days: [Mon, Tue, Wed, Thu, Fri]
    start: "09:00"
    end: "17:00"

rate_limits:
  web:
    max_requests_per_minute: 30
    max_concurrent_requests: 2
  scanner:
    max_concurrent_scans: 1

always_denied:
  - out_of_scope_target
  - destructive_exploitation
  - persistence
  - malware
  - credential_stuffing
  - data_extraction_beyond_poc
  - disable_logging
  - delete_evidence
  - modify_scope

data_handling:
  external_model_providers: configurable
  report_export_external_sinks: ask
  secret_redaction_required: true
  client_data_cross_engagement_memory: deny
