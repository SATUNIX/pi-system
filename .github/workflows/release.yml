name: release

# PAUSED. pi-system is currently delivered from the private GitLab (git delivery:
# packages/core/distribution.json), and releases are created by the `release` job in
# .gitlab-ci.yml. This workflow runs only by hand, and dry-run by default, until npm delivery is
# switched on (docs/releasing.md, "Switching to npm delivery"): restore the `push` trigger below
# and set "delivery": "npm" in packages/core/distribution.json.
#
# Continuous delivery of @satunix/pi-system to npm.
#
#   push to main        -> snapshot X.Y.Z[-pre].next.<utc>.g<sha>  on dist-tag `next`
#   push of tag vX.Y.Z  -> that exact version                     on dist-tag `latest`
#                          (`beta` / `release-X.Y` when it must not move latest; see
#                          packages/core/publish-plan.mjs and docs/releasing.md)
#
# Authentication is npm trusted publishing (OIDC): no npm token is stored in this repo. npm
# checks that the run comes from this repository, this workflow file and the `npm`
# environment. Every publish carries a signed provenance attestation linking the tarball to
# the exact commit and run. NPM_TOKEN is only a bootstrap fallback for the very first
# publish (a package must exist before a trusted publisher can be attached); delete the
# secret once trusted publishing is configured.
#
# Nothing publishes unless the full CI gate passes for the same commit.

on:
  # push:
  #   branches: [main]
  #   tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run the whole pipeline but stop before npm publish"
        type: boolean
        default: true

permissions:
  contents: read

# Never cancel a publish half way; serialise publishes per ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: npm
      url: https://www.npmjs.com/package/@satunix/pi-system
    permissions:
      contents: write # create the GitHub Release for a tag
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          # No dependency cache in the publishing job: a poisoned cache must never reach npm.
          package-manager-cache: false
      # Trusted publishing needs npm >= 11.5.1; Node 24's bundled npm has it. Fail loudly
      # rather than installing npm ad hoc outside the lockfile.
      - name: npm supports trusted publishing
        run: |
          v="$(npm --version)"; echo "npm $v"
          printf '%s\n' 11.5.1 "$v" | sort -V -C || { echo "npm $v < 11.5.1"; exit 1; }
      - run: npm ci --ignore-scripts --no-audit --no-fund

      # A release tag must point at a commit on main, so a tag pushed from an unreviewed
      # branch can never publish.
      - name: Tag is on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Plan version and dist-tag
        id: plan
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          tags="$(npm view @satunix/pi-system dist-tags --json 2>/dev/null || echo '{}')"
          node packages/core/publish-plan.mjs --ref "$REF" --sha "$SHA" --dist-tags "$tags" --write | tee -a "$GITHUB_OUTPUT"

      - name: Skip if already published
        id: exists
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          if npm view "@satunix/pi-system@${VERSION}" version >/dev/null 2>&1; then
            echo "@satunix/pi-system@${VERSION} is already on npm; nothing to do."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package check
        run: node packages/core/pack-check.mjs

      - name: Publish
        if: steps.exists.outputs.published == 'false' && !(github.event_name == 'workflow_dispatch' && inputs.dry-run)
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public --tag "$TAG" --ignore-scripts

      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: npm publish --dry-run --access public --tag "$TAG" --ignore-scripts

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/') && steps.exists.outputs.published == 'false'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: node packages/core/release-notes.mjs "$VERSION" --out release-notes.md

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && steps.exists.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          flags=(--latest)
          if [ "$TAG" != "latest" ] || [[ "$VERSION" == *-* ]]; then flags=(--prerelease --latest=false); fi
          gh release create "v${VERSION}" --title "v${VERSION}" --notes-file release-notes.md --verify-tag "${flags[@]}"
