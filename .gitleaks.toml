# Loaded automatically by the baseline secret_scan job (gitleaks reads
# .gitleaks.toml from the scan root). The default rules stay on; this only
# allowlists known synthetic values, matched on the line, never whole files.
[extend]
useDefault = true

[allowlist]
description = "Synthetic test fixtures and lab-only placeholder tokens"
regexTarget = "line"
regexes = [
  # pi-system/tests/save-smoke.mjs: fake tokens that the redaction test must scrub.
  '''glpat-ABCDEFGHIJKLMNOPQRST and AKIAABCDEFGHIJKLMNOP''',
  # Eval evidence against the throwaway lab target: placeholder bearer tokens.
  '''Bearer lab-[a-z]+''',
  '''curl -s -i http://lab:8080/''',
  # tests/firewall-gate-smoke.mjs, tests/tool-capture-smoke.mjs: fake bearer tokens the
  # firewall/capture redaction must handle.
  '''Authorization: Bearer abcdefghijklmnop(1234)?''',
  # tests/secret-guard-smoke.mjs: a stub key body ("abc") the secret guard must block.
  '''BEGIN OPENSSH PRIVATE KEY-----\\nabc\\n-----END''',
]
