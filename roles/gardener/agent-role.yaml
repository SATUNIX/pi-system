apiVersion: lab.tcd/v1
kind: AgentRole
metadata:
  name: gardener
spec:
  image: PENDING_SIGNED_DIGEST
  entry: pi run --role gardener --workflow <workflow> --input /inputs/context.json --output /outputs/result.json
  prompt: roles/gardener/SYSTEM.md
  resultSchema: roles/gardener/result.schema.json
  workTypes:
  - triage
  - implement
  model:
    litellmKey: openbao:agents/gardener/litellm
    models:
    - primary-reasoning
    - local-fast
    budget:
      daily_usd: 4.00
      per_run_tokens: 120000
  kubernetes:
    serviceAccount: agent-gardener
    clusterRole: null
    namespaces: []
  openbao:
    authRole: agent-gardener
    tokenTTL: 15m
    policy: agents/gardener/*
  gitlab:
    user: svc-agent-gardener
    tokenPath: openbao:agents/gardener/gitlab
  tools:
  - gitlab.mr.read
  - gitlab.repo.read
  - gitlab.branch.push
  - gitlab.mr.create
  - gitlab.mr.comment
  - render.verify
  - test.run
  egress:
  - litellm
  - openbao
  - gitlab
  escalation:
    notifyOperatorOn:
    - confidence<0.6
    - budget_exceeded
    - invalid_result
  limits:
    maxRuntime: 40m
    maxConcurrent: 2
