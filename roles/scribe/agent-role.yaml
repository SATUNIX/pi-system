apiVersion: lab.tcd/v1
kind: AgentRole
metadata:
  name: scribe
spec:
  image: PENDING_SIGNED_DIGEST
  entry: pi run --role scribe --workflow <workflow> --input /inputs/context.json --output /outputs/result.json
  prompt: roles/scribe/SYSTEM.md
  resultSchema: roles/scribe/result.schema.json
  workTypes:
  - implement
  model:
    litellmKey: openbao:agents/scribe/litellm
    models:
    - primary-reasoning
    - local-fast
    budget:
      daily_usd: 2.00
      per_run_tokens: 120000
  kubernetes:
    serviceAccount: agent-scribe
    clusterRole: null
    namespaces: []
  openbao:
    authRole: agent-scribe
    tokenTTL: 15m
    policy: agents/scribe/*
  gitlab:
    user: svc-agent-scribe
    tokenPath: openbao:agents/scribe/gitlab
  tools:
  - gitlab.repo.read
  - gitlab.branch.push
  - gitlab.mr.create
  - render.verify
  egress:
  - litellm
  - openbao
  - gitlab
  escalation:
    notifyOperatorOn:
    - confidence<0.6
    - budget_exceeded
    - invalid_result
  limits:
    maxRuntime: 25m
    maxConcurrent: 2
