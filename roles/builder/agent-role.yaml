apiVersion: lab.tcd/v1
kind: AgentRole
metadata:
  name: builder
spec:
  image: PENDING_SIGNED_DIGEST
  entry: pi run --role builder --workflow <workflow> --input /inputs/context.json --output /outputs/result.json
  prompt: roles/builder/SYSTEM.md
  resultSchema: roles/builder/result.schema.json
  workTypes:
  - implement
  model:
    litellmKey: openbao:agents/builder/litellm
    models:
    - primary-reasoning
    - local-fast
    budget:
      daily_usd: 8.00
      per_run_tokens: 400000
  kubernetes:
    serviceAccount: agent-builder
    clusterRole: null
    namespaces: []
  openbao:
    authRole: agent-builder
    tokenTTL: 15m
    policy: agents/builder/*
  gitlab:
    user: svc-agent-builder
    tokenPath: openbao:agents/builder/gitlab
  tools:
  - gitlab.issue.read
  - gitlab.repo.read
  - gitlab.branch.push
  - gitlab.mr.create
  - ops.lease.claim
  - render.verify
  - test.run
  egress:
  - litellm
  - openbao
  - gitlab
  escalation:
    notifyOperatorOn:
    - confidence<0.6
    - budget_exceeded
    - invalid_result
  limits:
    maxRuntime: 60m
    maxConcurrent: 2
